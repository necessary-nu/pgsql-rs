name: PG19 raw parser reference

on:
  push:
    paths:
      - 'tools/pg19/**'
      - 'crates/**'
      - 'protobuf/pg19/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/pgsql-reference.yml'
  pull_request:
    paths:
      - 'tools/pg19/**'
      - 'crates/**'
      - 'protobuf/pg19/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/pgsql-reference.yml'

jobs:
  reference:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install reference and schema build dependencies
        run: sudo apt-get update && sudo apt-get install -y bison flex clang ruby ruby-bundler protobuf-compiler python3-protobuf
      - run: python3 tools/pg19/tests/check-fixtures.py
      - run: /usr/bin/python3 tools/pg19/tests/check-schema.py
      - run: cargo build --release --locked -p pgsql-grammar --example pgsql-native -p pgsql-operations --example deparse-corpus
      - run: cargo test --locked -p pgsql-reference --test reference -- --ignored
        env:
          PYTHONPATH: /usr/lib/python3/dist-packages
          CFLAGS: -O3
          PG19_BENCHMARK: 1
          PG19_NATIVE_PROBE: ${{ github.workspace }}/target/release/examples/pgsql-native
          PG19_DEPARSE_PROBE: ${{ github.workspace }}/target/release/examples/deparse-corpus
