name: PG19 raw parser reference

on:
  push:
    paths:
      - 'tools/pg19/**'
      - 'crates/**'
      - 'protobuf/pg19/**'
      - 'protobuf/pg_query.proto'
      - 'scripts/extract_headers.rb'
      - 'scripts/generate_fingerprint_outfuncs.rb'
      - 'pg_query.h'
      - 'src/pg_query*.c'
      - 'src/pg_query*.h'
      - 'src/postgres_deparse.c'
      - 'src/include/**'
      - 'test/**'
      - 'vendor/upb/**'
      - 'vendor/xxhash/**'
      - 'scripts/generate_protobuf_and_funcs.rb'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/pg19-reference.yml'
  pull_request:
    paths:
      - 'tools/pg19/**'
      - 'crates/**'
      - 'protobuf/pg19/**'
      - 'protobuf/pg_query.proto'
      - 'scripts/extract_headers.rb'
      - 'scripts/generate_fingerprint_outfuncs.rb'
      - 'pg_query.h'
      - 'src/pg_query*.c'
      - 'src/pg_query*.h'
      - 'src/postgres_deparse.c'
      - 'src/include/**'
      - 'test/**'
      - 'vendor/upb/**'
      - 'vendor/xxhash/**'
      - 'scripts/generate_protobuf_and_funcs.rb'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/pg19-reference.yml'

jobs:
  reference:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install reference and schema build dependencies
        run: sudo apt-get update && sudo apt-get install -y bison flex clang ruby ruby-bundler protobuf-compiler python3-protobuf
      - run: python3 tools/pg19/tests/check-fixtures.py
      - run: /usr/bin/python3 tools/pg19/tests/check-schema.py
      - run: cargo test --locked --workspace
      - run: cargo build --release --locked -p pg19-parser --example pg19-native
      - run: cargo test --locked -p pg19-reference --test reference -- --ignored
        env:
          PYTHONPATH: /usr/lib/python3/dist-packages
          PG19_NATIVE_PROBE: ${{ github.workspace }}/target/release/examples/pg19-native
