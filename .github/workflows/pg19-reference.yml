name: PG19 raw parser reference

on:
  push:
    paths:
      - 'tools/pg19/**'
      - 'crates/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/pg19-reference.yml'
  pull_request:
    paths:
      - 'tools/pg19/**'
      - 'crates/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/pg19-reference.yml'

jobs:
  reference:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install PostgreSQL build dependencies
        run: sudo apt-get update && sudo apt-get install -y bison flex
      - run: python3 tools/pg19/tests/check-fixtures.py
      - run: cargo test --locked --workspace
      - run: cargo test --locked -p pg19-reference --test reference -- --ignored
