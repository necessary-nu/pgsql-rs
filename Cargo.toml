[workspace]
members = ["crates/*"]
resolver = "2"

[workspace.package]
edition = "2021"
publish = false

[workspace.dependencies]
pgsql-codec = { path = "crates/pgsql-codec" }
pgsql-engine = { path = "crates/pgsql-engine" }
pgsql-lexer = { path = "crates/pgsql-lexer" }
pgsql-nodes = { path = "crates/pgsql-nodes" }
pgsql-operations = { path = "crates/pgsql-operations" }
pgsql-grammar = { path = "crates/pgsql-grammar" }
pgsql-plpgsql = { path = "crates/pgsql-plpgsql" }
pgsql-reference = { path = "crates/pgsql-reference" }
pgsql-tables = { path = "crates/pgsql-tables" }
pgsql-parser = { path = "crates/pgsql-parser" }
itoa = "1"
serde_json = "1"
